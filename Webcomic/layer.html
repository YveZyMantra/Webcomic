<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A manhwa-style webcomic featuring Mithi and Hiraya — scroll to read.">
  <title>Webcomic — Mithi & Hiraya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="designlayer.css">
</head>
<body>

  <!-- Scroll progress indicator -->
  <div class="scroll-progress" id="scroll-progress"></div>

  <!-- Comic strip — manhwa vertical scroll -->
  <div class="comic-strip">

    <!-- Panel 1 — Opening: new school, fresh start -->
    <div class="panel" id="panel-1">
      <img class="panel__image" src="PanelSeq/1.png" alt="Panel 1 — A new school, a fresh start">
    </div>

    <!-- Panel 2 -->
    <div class="panel" id="panel-2">
      <img class="panel__image" src="PanelSeq/2.png" alt="Panel 2">
    </div>

    <!-- Panel 3 -->
    <div class="panel" id="panel-3">
      <img class="panel__image" src="PanelSeq/3.png" alt="Panel 3">
    </div>

    <!-- Panel 4 -->
    <div class="panel" id="panel-4">
      <img class="panel__image" src="PanelSeq/4.png" alt="Panel 4">
    </div>

    <!-- Panel 5 -->
    <div class="panel" id="panel-5">
      <img class="panel__image" src="PanelSeq/5.png" alt="Panel 5">
    </div>

    <!-- Panel 6 -->
    <div class="panel" id="panel-6">
      <img class="panel__image" src="PanelSeq/6.png" alt="Panel 6">
    </div>

    <!-- Panel 7 -->
    <div class="panel" id="panel-7">
      <img class="panel__image" src="PanelSeq/7.png" alt="Panel 7">
    </div>

    <!-- Panel 8 -->
    <div class="panel" id="panel-8">
      <img class="panel__image" src="PanelSeq/8.png" alt="Panel 8">
    </div>

    <!-- Panel 9 -->
    <div class="panel" id="panel-9">
      <img class="panel__image" src="PanelSeq/9.png" alt="Panel 9">
    </div>

    <!-- Panel 10 -->
    <div class="panel" id="panel-10">
      <img class="panel__image" src="PanelSeq/10.png" alt="Panel 10">
    </div>

    <!-- Panel 11 — Finale: reunion in the rain -->
    <div class="panel" id="panel-11">
      <img class="panel__image" src="PanelSeq/11.png" alt="Panel 11 — Mithi and Hiraya embrace in the rain">
    </div>

  </div>

  <!-- Load the scroll controller -->
  <script src="interaction.js"></script>

</body>
</html>
